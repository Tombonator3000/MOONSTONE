# Bygger PC-porten for Linux og Windows og nettleserversjonen ved hver push.
# Ferdige filer ligger under "Artifacts" paa siden til hver kjoring i Actions-fanen.
#
# Ved push til main legges Linux- og Windows-pakkene ogsaa ut som en utgivelse
# med taggen "siste" (jobben utgivelse), saa spillere kan laste dem ned uten
# aa logge inn: https://github.com/Tombonator3000/MOONSTONE/releases/tag/siste
#
# Paa hovedgrenen legges nettleserversjonen ogsaa ut paa GitHub Pages, baade ved
# push og naar kjoringen startes for haand ("Run workflow" paa main). Det krever
# at Pages er slaatt paa: Settings -> Pages -> Source: GitHub Actions. For et
# privat repo krever GitHub et betalt abonnement for Pages. Til Pages er klart,
# feiler bare det steget, uten at resten av kjoringen blir rod.
#
# MED_SPILLET: "ja" bygger Moonstonecd32-AMIGA.zip fra repoet inn i programmene og
# nettsiden (port/bin2c.py), saa spillet starter uten at noen maa finne filen.
# Eieren har bestemt dette (Moonstone regnes som abandonware). Sett til "nei" for
# aa bygge uten; da maa verten velge filen selv. Gjester trenger den aldri.
name: Bygg

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  MED_SPILLET: "ja"

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Installer SDL2
        run: |
          sudo rm -f /var/lib/man-db/auto-update
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libsdl2-dev
      - name: Bygg
        run: make -C port -j4 moonstone headless
      - name: Kjor introen uten vindu
        run: |
          cd port
          ./moonstone-headless --headless --frames 3000 --log 0 | tee ut.txt
          grep -q "Ferdig etter 3000 bilder" ut.txt
      - name: Sjekk C-erstatningene mot originalen
        run: |
          python3 tools/check_hooks.py | tee hooks.txt
          grep -q "OK: 25 av 25" hooks.txt
      - name: Pakk
        run: |
          mkdir -p pakke/moonstone
          cp port/moonstone README.md pakke/moonstone/
      - uses: actions/upload-artifact@v7
        with:
          name: moonstone-linux
          path: pakke/

  windows:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SDL2_VERSION: 2.30.8
      SDL2_SHA256: adbf5ae7b5144f02d4cb091a9a7f4752f8e835b4bebd9f3fcafd9d7a4194f3b9
    steps:
      - uses: actions/checkout@v7
      - name: Installer MinGW
        run: |
          sudo rm -f /var/lib/man-db/auto-update
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64 mingw-w64-x86-64-dev
      - name: Hent SDL2 for MinGW
        run: |
          curl -sSL -o sdl.tar.gz https://github.com/libsdl-org/SDL/releases/download/release-${SDL2_VERSION}/SDL2-devel-${SDL2_VERSION}-mingw.tar.gz
          echo "${SDL2_SHA256}  sdl.tar.gz" | sha256sum -c
          tar xzf sdl.tar.gz
      - name: Bygg moonstone.exe
        run: make -C port -j4 windows SDL2_MINGW=$PWD/SDL2-${SDL2_VERSION}/x86_64-w64-mingw32
      - name: Pakk
        run: |
          mkdir -p pakke/moonstone
          cp port/moonstone.exe port/SDL2.dll windows/start.bat windows/LES_MEG.txt pakke/moonstone/
          cp SDL2-${SDL2_VERSION}/LICENSE.txt pakke/moonstone/SDL2_LICENSE.txt 2>/dev/null || true
      - uses: actions/upload-artifact@v7
        with:
          name: moonstone-windows
          path: pakke/

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: mymindstorm/setup-emsdk@v16
        with:
          version: 3.1.74
      - name: Bygg nettleserversjonen
        run: make -C port -j4 web
      - name: Klargjor siden
        run: |
          mkdir -p side
          cp web/build/moonstone.html side/index.html
          cp -R web/build/hd side/
      - uses: actions/upload-artifact@v7
        with:
          name: moonstone-web
          path: side/
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          path: side

  pages:
    needs: web
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5

  # Lager eller oppdaterer utgivelsen "siste" med zip-filene for Linux og Windows.
  # Taggen flyttes til commiten som ble bygget, og filene byttes ut. Zip-filene
  # lages her og ikke i artefaktene, fordi artefakter mister kjorerettigheten.
  utgivelse:
    needs: [linux, windows]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: utgivelse-siste
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: moonstone-linux
          path: ned/linux
      - uses: actions/download-artifact@v8
        with:
          name: moonstone-windows
          path: ned/windows
      - name: Pakk zip-filene
        run: |
          chmod +x ned/linux/moonstone/moonstone
          (cd ned/linux && zip -r -9 ../../moonstone-linux.zip moonstone)
          (cd ned/windows && zip -r -9 ../../moonstone-windows.zip moonstone)
          unzip -l moonstone-linux.zip
          unzip -l moonstone-windows.zip
      - name: Lag eller oppdater utgivelsen
        run: |
          kort=$(echo "$GITHUB_SHA" | cut -c1-7)
          dato=$(date -u +%Y-%m-%d)
          cat > notat.md <<EOF
          Siste bygg fra main (commit $kort, $dato).

          - moonstone-windows.zip: pakk ut og dobbeltklikk start.bat eller moonstone.exe.
          - moonstone-linux.zip: pakk ut og kjor moonstone/moonstone. Trenger libSDL2
            (sudo apt install libsdl2-2.0-0) og glibc 2.34 eller nyere (bygget paa Ubuntu 24.04).

          Spillfilen er bygget inn, saa det trengs ingen andre filer.
          Nettleserversjonen: https://tombonator3000.github.io/MOONSTONE/
          EOF
          if gh release view siste >/dev/null 2>&1; then
            gh api -X PATCH "repos/$GH_REPO/git/refs/tags/siste" -f sha="$GITHUB_SHA" -F force=true \
              || gh api -X POST "repos/$GH_REPO/git/refs" -f ref=refs/tags/siste -f sha="$GITHUB_SHA"
            gh release edit siste --prerelease --title "Moonstone (siste bygg)" --notes-file notat.md
            gh release upload siste moonstone-linux.zip moonstone-windows.zip --clobber
          else
            gh release create siste moonstone-linux.zip moonstone-windows.zip --prerelease \
              --target "$GITHUB_SHA" --title "Moonstone (siste bygg)" --notes-file notat.md
          fi
